spring.application.name=art-fly-bot
# Локальные секреты (файл в .gitignore), см. application-local.properties
spring.config.import=optional:file:./application-local.properties

# Claude API
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-sonnet-5-5
spring.ai.anthropic.chat.options.max-tokens=1024

# ART FLY
artfly.data-dir=data
artfly.zone=Europe/Moscow
artfly.telegram-token=${TELEGRAM_BOT_TOKEN:}
